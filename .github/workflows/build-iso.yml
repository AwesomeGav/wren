name: Build Wren ISO

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

# A newer push cancels an older build that's still running
concurrency:
  group: build-iso
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged -v /lib/modules:/lib/modules:ro
    steps:
      - uses: actions/checkout@v5

      - name: Reuse downloaded packages from earlier builds
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ hashFiles('packages.txt') }}-${{ github.run_id }}
          restore-keys: |
            pacman-${{ hashFiles('packages.txt') }}-
            pacman-

      - name: Install build tools
        run: pacman -Syu --noconfirm archiso python zstd

      - name: Check scripts for syntax errors
        run: |
          for f in build.sh wren-setup live/usr/lib/wren/install-backend.sh tests/*.sh migrations/*.sh rootfs/usr/lib/wren/*.sh rootfs/usr/local/bin/wren-update; do bash -n "$f"; done
          python -m py_compile rootfs/usr/lib/wren/*.py live/usr/lib/wren/installer.py
          python tests/test-greeter.py

      - name: Build the ISO
        run: bash build.sh

      - name: Software graphics device for the window manager test
        continue-on-error: true
        run: |
          pacman -S --noconfirm --needed kmod
          modprobe vgem && ls -la /dev/dri || echo "vgem not available; the desktop test will use the fallback window manager"

      - name: Take screenshots of the desktop
        continue-on-error: true
        run: bash tests/screenshots.sh || true

      - name: Test the installer on a virtual disk
        run: bash tests/test-install.sh

      - name: Test installing next to Windows, then boot it
        run: bash tests/test-dualboot.sh

      - name: Upload screenshots (screenshots branch)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pacman -S --noconfirm --needed git >/dev/null
          mkdir -p screenshots && cd screenshots
          git init -q -b screenshots
          git -c user.name="Wren Build" -c user.email="build@users.noreply.github.com" add -A
          git -c user.name="Wren Build" -c user.email="build@users.noreply.github.com" commit -q --allow-empty -m "Screenshots for build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

      - name: Keep only the newest package versions in the cache
        run: |
          pacman -S --noconfirm --needed pacman-contrib >/dev/null
          paccache -rk1 -c /var/cache/pacman/pkg || true

      - name: Publish as a download (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Floe (build ${{ github.run_number }})
          body: |
            Download the .iso below, flash it to a USB stick with balenaEtcher or Ventoy, and boot from it.
            The installer opens automatically. Pick **Install Floe** and follow the steps.
          files: out/*.iso
          make_latest: true
