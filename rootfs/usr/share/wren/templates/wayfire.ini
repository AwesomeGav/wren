# Wren window manager (Wayfire). Generated by wren-theme from Settings;
# changes here are overwritten. Wayfire reloads this file by itself.

[core]
plugins = animate autostart command decoration foreign-toplevel grid gtk-shell move place resize session-lock shortcuts-inhibit switcher wm-actions xdg-activation
vwidth = 1
vheight = 1
preferred_decoration_mode = client
xwayland = lazy
close_top_view = <alt> KEY_F4
background_color = $bg_wf
focus_buttons_passthrough = true

[input]
xkb_layout = $xkb_layout
xkb_variant = $xkb_variant
kb_repeat_rate = $repeat_rate
kb_repeat_delay = $repeat_delay
mouse_cursor_speed = $mouse_speed
mouse_natural_scroll = $mouse_natural
left_handed_mode = $left_handed
natural_scroll = $touchpad_natural
tap_to_click = $tap_to_click
disable_touchpad_while_typing = $dwt
touchpad_cursor_speed = $touchpad_speed
cursor_theme = Wren-Cursor
cursor_size = $cursor_size

# Windows zoom open and closed, squeeze down into the dock when minimized,
# and the whole desktop fades in after you sign in.
[animate]
open_animation = $open_anim
close_animation = $close_anim
minimize_animation = $min_anim
duration = 260ms circle
zoom_duration = 260ms circle
fade_duration = 220ms circle
squeezimize_duration = 320ms circle
startup_duration = 700ms circle
# Notifications fade; the launcher and quick settings animate themselves (no extra delay)
fade_enabled_for = (type equals "overlay" & app_id contains "notifications")

# Drag a window to the top edge to maximize, to a side to fill half the screen
[grid]
type = $grid_anim
duration = 260ms circle

[move]
enable_snap = true
snap_threshold = 12
quarter_snap_threshold = 50
preview_base_color = $snap_fill
preview_base_border = $snap_border
preview_border_width = 2

[place]
mode = center

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB
speed = 380ms circle
view_thumbnail_scale = 1.0

[wm-actions]
toggle_showdesktop = <super> KEY_D

# Title bars for the few apps that don't draw their own
[decoration]
font = IBM Plex Sans SemiBold
font_color = $text_wf
font_scale = 0.75
title_height = 34
border_size = 1
button_order = minimize maximize close
active_color = $window_wf
inactive_color = $window_wf

[command]
binding_launcher = <super>
command_launcher = wren-shell launcher
binding_launcher2 = <super> KEY_SPACE
command_launcher2 = wren-shell launcher
binding_control = <super> KEY_A
command_control = wren-shell control
binding_terminal = <super> KEY_ENTER
command_terminal = wren-terminal
binding_files = <super> KEY_E
command_files = nautilus --new-window
binding_lock = <super> KEY_L
command_lock = wren-lock
binding_screenshot = KEY_SYSRQ | KEY_PRINT
command_screenshot = wren-screenshot
repeatable_binding_volup = KEY_VOLUMEUP
command_volup = wren-osd volume up
repeatable_binding_voldown = KEY_VOLUMEDOWN
command_voldown = wren-osd volume down
binding_mute = KEY_MUTE
command_mute = wren-osd volume mute
repeatable_binding_lightup = KEY_BRIGHTNESSUP
command_lightup = wren-osd brightness up
repeatable_binding_lightdown = KEY_BRIGHTNESSDOWN
command_lightdown = wren-osd brightness down

[autostart]
autostart_wf_shell = false
wren = sh /usr/lib/wren/session-start.sh
