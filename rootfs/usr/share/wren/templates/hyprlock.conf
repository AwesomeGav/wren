# Wren lock screen: frosted wallpaper, big clock, your name above a pill password box
general {
    hide_cursor = false
    grace = 0
}

animations {
    enabled = true
    bezier = glide, 0.18, 0.9, 0.28, 1.0
    animation = fadeIn, 1, 5, glide
    animation = fadeOut, 1, 4, glide
    animation = inputFieldDots, 1, 2, glide
    animation = inputFieldColors, 1, 4, glide
    animation = inputFieldFade, 1, 4, glide
}

background {
    monitor =
    path = $wallpaper_blur
    color = rgba(${glass_rgb}, 1.0)
    blur_passes = 0
}

# Date and time, top left
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(${text2_rgb}, 0.95)
    font_size = 20
    font_family = IBM Plex Sans Medium
    position = 52, -44
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] date +"$clock_fmt"
    color = rgba(${text_rgb}, 0.92)
    font_size = 104
    font_family = IBM Plex Sans Light
    position = 46, -78
    halign = left
    valign = top
}

# Wi-Fi and battery, top right
label {
    monitor =
    text = cmd[update:10000] /usr/lib/wren/lock-status.sh
    color = rgba(${text_rgb}, 0.9)
    font_size = 15
    font_family = IBM Plex Sans SemiBold, Symbols Nerd Font
    position = -44, -40
    halign = right
    valign = top
}

# Picture and name, bottom middle
image {
    monitor =
    path = $avatar
    size = 34
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.85)
    position = -$name_shift, 132
    halign = center
    valign = bottom
}
label {
    monitor =
    text = $USER_NAME
    color = rgba(${text_rgb}, 0.95)
    font_size = 16
    font_family = IBM Plex Sans SemiBold
    position = 22, 138
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 380, 52
    outline_thickness = 1
    rounding = -1
    outer_color = rgba(255, 255, 255, 0.55)
    inner_color = rgba(${glass_rgb}, 0.55)
    font_color = rgba(${text_rgb}, 1.0)
    check_color = rgba(${accent_rgb}, 1.0)
    fail_color = rgba(229, 72, 77, 1.0)
    placeholder_text = Enter password
    fail_text = Wrong password, try again
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(30, 45, 70, 0.18)
    position = 0, 60
    halign = center
    valign = bottom
}
