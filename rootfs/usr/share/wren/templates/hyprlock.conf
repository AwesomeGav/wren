# Wren lock screen
background {
    monitor =
    path = $wallpaper
    color = rgba(20, 18, 16, 1.0)
    brightness = 0.55
    blur_passes = 0
}

label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(${text_rgb}, 1.0)
    font_size = 104
    font_family = Inter Light
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(${dim_rgb}, 1.0)
    font_size = 20
    font_family = Inter
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    rounding = 0
    outer_color = rgba(${border2_rgb}, 1.0)
    inner_color = rgba(${window_rgb}, 0.92)
    font_color = rgba(${text_rgb}, 1.0)
    check_color = rgba(${accent_rgb}, 1.0)
    fail_color = rgba(226, 109, 92, 1.0)
    placeholder_text = Password
    fail_text = Wrong password
    dots_size = 0.22
    dots_spacing = 0.35
    fade_on_empty = false
    position = 0, -30
    halign = center
    valign = center
}
