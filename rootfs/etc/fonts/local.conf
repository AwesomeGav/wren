<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Wren: crisp, even text. Smooth edges, light hinting, Inter for the interface. -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Noto Sans</family></prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <!-- Inter: easier-to-tell-apart l and I -->
  <match target="font">
    <test name="family" compare="eq"><string>Inter</string></test>
    <edit name="fontfeatures" mode="append"><string>cv05 on</string><string>cv08 on</string><string>tnum off</string></edit>
  </match>
</fontconfig>
