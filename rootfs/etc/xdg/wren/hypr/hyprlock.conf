# Wren lock screen
background {
    monitor =
    path = /usr/share/wren/wallpaper.jpg
    color = rgba(20, 18, 16, 1.0)
    brightness = 0.55
    blur_passes = 0
}

label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(241, 235, 227, 1.0)
    font_size = 104
    font_family = Inter Light
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(200, 190, 178, 1.0)
    font_size = 20
    font_family = Inter
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    rounding = 14
    outer_color = rgba(58, 52, 46, 1.0)
    inner_color = rgba(28, 25, 22, 0.92)
    font_color = rgba(241, 235, 227, 1.0)
    check_color = rgba(224, 137, 74, 1.0)
    fail_color = rgba(226, 109, 92, 1.0)
    placeholder_text = Password
    fail_text = Wrong password
    dots_size = 0.22
    dots_spacing = 0.35
    fade_on_empty = false
    position = 0, -30
    halign = center
    valign = center
}
